# Execution parameters
---
preprocess:
  fastp:
    length_required: 25  # nonpareil requires at least 25bp
    extra: "--trim_poly_g --trim_poly_x"
  bowtie2-build:
    memory_gb: 8
  bowtie2:
    memory_gb: 64
    samtools:
      mem_per_thread: 1G

read_annotate:
  diamond:
    max-target-seqs: 1    # Max. number of hits per query
  kraken2:
    memory_gb: 32
  nonpareil:
    X: 100    #Default: 1000, smaller for testing!!!
  humann:
    additional_options: "--remove-temp-output"

assemble:
  megahit:
    mincount: 2
    kmin: 21  # (complex, set to 27)
    kmax: 141 # (complex, set to 127)
    kstep: 10
    min_contig_len: 1500 # (make is short for complex, 500)
    memory_gb: 32
    additional_options: ""  # For deep sequenced samples (e.g. > 30x, add --no-mercy for a less noisy graph)
  metaspades:
    kmer_size: "21,33,55"
    additional_options: "--only-assembler"
  metabat:
    min_contig_len: 1500 # (make is short for complex, 500)
  maxbin:
    min_contig_len: 1500 # (make is short for complex, 500)
  bowtie2-build:
    memory_gb: 16
  bowtie2:
    memory_gb: 32
  samtools:
    mem: 8G   # Take care that there is enough memory reserved for the bowtie map rule, the memory is per thread! Or reduce that value
    out_type: "cram"  # Change this to 'bam' in case the rule assemble__bowtie2__map throws an error that the cram header is too long
  drep:
    completeness: 50  # Default: 50
    contamination: 50 # Default: 50
    P_ani: 0.9  # Default: 0.9
    S_ani: 0.95  # Default: 0.95
    nc: 0.1 # Default: 0.1
    extra: " " # Default: ""
  magscot:
    extra: "--n_iter=1" # Default: "", different value might be relicts from testing
    threshold : "0.5" # Scoring minimum completeness threshold [default=0.5]"

quantify:
  bowtie2-build:
    memory_gb: 32
  bowtie2:
    memory_gb: 32
  samtools:
    mem: 1G
  coverm:
    genome:
      methods:  ["count", "covered_bases", "length", "tpm"]  # https://github.com/wwood/CoverM#calculation-methods
      min_covered_fraction: 0.0
      separator: "@"
    contig:
      methods:  ["count", "covered_bases", "length", "tpm"]  # https://github.com/wwood/CoverM#calculation-methods

mag_annotate:
  bakta:
    additional_options: " --skip-crispr --skip-plot "
  phylophlan:
    diversity: "high"
    
contig_annotate:
  prodigal:
    split: 1000000   # For quicker data processing is the prodigal output processed in chunks of this size
  hmmer:
    domt:
      fefe: 15.9
      nife: 34.5
      fe: 54.4
      fallback: 10.0   # fallback value for unknown databases

eukaryote:
  tiara:
    min_len: 1000  # Tiara default: 3000; 1000 is its documented lower limit and keeps short-contig (e.g. soil) assemblies classifiable
    prob_cutoff: [0.65, 0.65]  # first and second stage, Tiara default
  4cac:  # only runs on metaSPAdes assemblies (needs the assembly graph)
    install_dir: "/pkg/4CAC"  # where classify_xgb.py and classify_4CAC.py are inside the 4cac container
    phage: 0.95  # 4CAC default
    plasmid: 0.95  # 4CAC default
  remag:
    min_contig_length: 1000  # REMAG picks 1000 or 4096 from the median contig length; fixed so the filter and bin steps match
    min_bin_size: 500000  # REMAG default
    hyenadna_batch_size: 1024  # REMAG default; raise on a GPU
    extra: ""  # further options for the binning run, e.g. "--epochs 50"