#################################
##
## File configuration configuration

pipeline_folder: "/users/fischerd/git/Snakebite-Holoruminant-MetaG/"

features-file: "config/features.yaml"
params-file: "config/params.yaml"
docker-file: "config/.docker.yml"
sample-file: "config/samples.tsv"
dram-config: "config/dram_config.txt"
proteinortho-config: "config/proteinortho_config.txt"
phylophlan-config: "config/phylophlan/supertree_aa.cfg"

# Roihu has its local disk in $TMPDIR in every job. $LOCAL_SCRATCH exists only when it is reserved on a hugemem node
tmp_storage: "$TMPDIR"
nvme_storage: "$TMPDIR"
shm_storage: "/dev/shm"      # If shm is not available, set to a fast disc (same as nvme_storage), if that is not available, point it to a regular disc (like tmp_storage)

copy_dbs: "True"          # If "True", dbs will be copied to faster discspaces, where applicable. Set to "False" to keep the original locations during runtime.
diamond_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")
eggnog_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")
kraken2_shm: "True"       # Set "True", if shm space should be used for diamond, if "False" nvme_storage will be used as fall back (if copy_dbs="True")

assembler: "metaspades"  # "metaspades", "megahit" or e.g. "provided". Megahit serves as fall-back in case metaspades cannot create the assemblies. With any other folder name the pipeline expects self-provided assemblies in results/assemble/<name>/<assembly>.fa.gz .


#################################
##
## Resource limitations (to limit project-wide the parallel execution of certain rules)

metaspades_slots: 10

#################################
##
## Server configuration

# The defaults are for CSC's Roihu, checked on 2026-11-05 against
# https://docs.csc.fi/computing/running/batch-job-partitions/ and tests/resources/check_resource_sets.py
# checks them. On another system, check all of this first.
#
#   small    72 hours, 1 node, up to 384 cores and 1500 GiB, 20 GiB in $TMPDIR. Cores and memory are independent
#   longrun  10 days,  1 node, up to 192 cores and 1500 GiB, 20 GiB in $TMPDIR. Cores and memory are independent
#   medium   36 hours, full nodes only, 384 cores and 744 GiB per node, 600 GiB in $TMPDIR
#   hugemem  36 hours, up to 128 cores and 6037 GiB, with the memory fixed by the cores. No set here uses it
#
# A job asks for its local disk with `nvme`, which is the value of --gres. On Roihu, only the hugemem partitions have
# this, and asking for it elsewhere gives "Requested node configuration is not available". All other jobs get $TMPDIR
# without asking, so `nvme` stays empty, and the sets with _nvme in their name are the same as those without it.
resource_sets:
  small:
    runtime: 300
    mem_mb: 16000
    cpus: 1
    partition: "small"
    nvme: ""

  medium:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "small"
    nvme: ""

  medium_nvme:
    runtime: 4000
    mem_mb: 160000
    cpus: 10
    partition: "small"
    nvme: ""

  large:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "small"
    nvme: ""

  large_nvme:
    runtime: 4000
    mem_mb: 320000
    cpus: 20
    partition: "small"
    nvme: ""

  # The nodes of type L have 1536 GiB, and small takes up to 1500 GiB
  highmem:
    runtime: 4000
    mem_mb: 1400000
    cpus: 20
    partition: "small"
    nvme: ""

  longrun:
    runtime: 14400
    mem_mb: 320000
    cpus: 20
    partition: "longrun"
    nvme: ""

  highmem_longrun:
    runtime: 14400
    mem_mb: 1400000
    cpus: 20
    partition: "longrun"
    nvme: ""

  # A whole node, for a ramdisk in /dev/shm for time-critical tasks, so that no other users are on the node while the
  # job runs, as their jobs might be affected. A node of medium has 384 cores and always costs the whole node, which is
  # 288 billing units per hour. In case you do not want to (or cannot) use /dev/shm, please define a different file path
  # in config/config.yaml, or set kraken2_shm and the like to "False".
  full_node:
    runtime: 2160
    mem_mb: 740000
    cpus: 384
    partition: "medium"
    nvme: ""
