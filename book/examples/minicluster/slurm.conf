# One node, two partitions named like the ones on a real cluster. Nothing here limits memory or
# isolates jobs, which a production system would do with cgroups.
ClusterName=minicluster
GresTypes=nvme
SlurmctldHost=localhost
SlurmUser=root
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageEnforce=associations
AccountingStoreFlags=job_comment
ReturnToService=2
MinJobAge=60
NodeName=localhost CPUs=4 RealMemory=6000 Gres=nvme:100 State=UNKNOWN
PartitionName=small Nodes=localhost Default=YES MaxTime=3-00:00:00 State=UP
PartitionName=large Nodes=localhost MaxTime=3-00:00:00 State=UP
